<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Shrey Jain - Computer Science Engineer</title>
    <meta name="title" content="Shrey Jain - Computer Science Engineer" />
    <meta
      name="description"
      content="Shrey Jain's personal portfolio website. Boot up the machine and read the CV."
    />
    <meta name="theme-color" content="#0b0b0f" />
    <link rel="canonical" href="https://shreyjain.in/" />

    <!-- Link previews need absolute URLs, so these name the canonical domain
         rather than whatever host the build happens to be served from. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Shrey Jain" />
    <meta property="og:url" content="https://shreyjain.in/" />
    <meta property="og:title" content="Shrey Jain - Computer Science Engineer" />
    <meta
      property="og:description"
      content="Shrey Jain's personal portfolio website. Boot up the machine and read the CV."
    />
    <meta property="og:image" content="https://shreyjain.in/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A desk at night: a CRT monitor showing Shrey Jain's name, a glass-side PC tower, and a keyboard."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Shrey Jain - Computer Science Engineer" />
    <meta
      name="twitter:description"
      content="Shrey Jain's personal portfolio website. Boot up the machine and read the CV."
    />
    <meta name="twitter:image" content="https://shreyjain.in/og.png" />
  </head>
  <body>
    <!-- CSS3D layer: the live DOM that gets projected onto the CRT screen -->
    <div id="css"></div>
    <!-- WebGL layer: the room, the desk, the machine -->
    <canvas id="webgl"></canvas>
    <!-- Screen-space chrome: loader, hints, controls -->
    <div id="ui"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
